# Photos of the road trip's places (free licences, from Wikimedia) for the itinerary doc.
# Push to bot/img to run; the photos land on bot/img-out.
name: Photos de l'itinéraire
on:
  push:
    branches: [bot/img]
permissions:
  contents: write
jobs:
  img:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/img/fetch.mjs /tmp/img
      - name: Publish on bot/img-out
        working-directory: /tmp/img
        run: |
          git init -q -b bot/img-out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Photos ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" bot/img-out
