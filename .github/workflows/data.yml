# Builds the trail data that needs the open internet (points of interest from OpenStreetMap,
# elevation profile from the Terrain Tiles DEM) and publishes it on the bot/data-out branch.
name: Données du sentier
on:
  push:
    branches: [bot/data]
permissions:
  contents: write
jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: scripts/data
        run: npm init -y >/dev/null && npm i --no-save pngjs@7.0.0
      - name: Points of interest
        run: mkdir -p /tmp/out && node scripts/data/pois.mjs /tmp/out/pois.json 2>&1 | tee /tmp/out/pois.log
      - name: Elevation profile
        if: env.SKIP_PROFILE != '1'
        run: node scripts/data/profile.mjs /tmp/out/profile.json 2>&1 | tee /tmp/out/profile.log
      - name: Publish on bot/data-out
        working-directory: /tmp/out
        run: |
          git init -q -b bot/data-out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Data ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" bot/data-out
