# The film's 3D flight over the real relief (the development sandbox can't reach the map tiles).
# Push a commit to bot/film to run; the result lands on the bot/film-out branch.
name: Film 3D
on:
  push:
    branches: [bot/film]
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the site
        working-directory: web
        run: npm ci
      - name: Install the browser and ffmpeg
        working-directory: scripts/film
        run: |
          npm init -y >/dev/null && npm i --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Start the dev server
        working-directory: web
        run: |
          nohup npx vite --port 5173 --strictPort > /tmp/vite.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:5173/ >/dev/null && break; sleep 1; done
      - name: Render
        timeout-minutes: 70
        run: |
          mkdir -p /tmp/film
          set -o pipefail
          node scripts/film/render3d.mjs /tmp/film 2>&1 | tee /tmp/film/run.log
      - name: Publish on bot/film-out
        if: always()
        working-directory: /tmp/film
        run: |
          cp /tmp/vite.log . || true
          git init -q -b bot/film-out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Film ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" bot/film-out
